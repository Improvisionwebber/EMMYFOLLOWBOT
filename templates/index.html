<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EMMY — TikTok F4F Finder (Pro)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

    :root{
      --bg:#050507;
      --panel:#0b0b0d;
      --muted:#9aa0a6;
      --neon:#39FF14; /* neon hacker green */
      --accent: rgba(57,255,20,0.08);
      --glass: rgba(255,255,255,0.02);
    }

    html,body{
      height:100%;
      margin:0;
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: var(--bg);
      color:#e6eef1;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Mirror / cracked screen background effect
       - built from layered linear-gradients to look like fractured glass
       - subtle animation (shift) to give life without being distracting
    */
    body::before{
      content:'';
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      background:
        radial-gradient(1200px 500px at 10% 20%, rgba(57,255,20,0.02), transparent 10%),
        radial-gradient(900px 350px at 90% 80%, rgba(57,255,20,0.015), transparent 10%),
        linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
      mix-blend-mode: screen;
      opacity:1;
    }

    /* Crack lines overlay */
    body::after{
      content:'';
      position:fixed;
      inset:0;
      z-index:0;
      background-image:
        linear-gradient(150deg, rgba(255,255,255,0.03) 0 1px, transparent 1px),
        linear-gradient(210deg, rgba(255,255,255,0.02) 0 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 0 1px, transparent 1px);
      background-size: 100% 40px, 100% 80px, 100% 120px;
      filter: blur(0.6px) contrast(0.95);
      opacity:0.18;
      transform:translateZ(0);
      pointer-events:none;
    }

    /* container */
    .page {
      position:relative;
      z-index:10;
      max-width:1100px;
      margin:28px auto;
      padding:20px;
      box-sizing:border-box;
    }

    header{
      display:flex;
      gap:16px;
      align-items:center;
      justify-content:space-between;
      margin-bottom:18px;
    }

    .brand {
      display:flex;
      gap:12px;
      align-items:center;
    }

    .logo {
      width:56px;
      height:56px;
      border-radius:8px;
      background:linear-gradient(135deg, rgba(57,255,20,0.08), rgba(57,255,20,0.02));
      border:1px solid rgba(57,255,20,0.12);
      display:grid;
      place-items:center;
      font-weight:900;
      color:var(--neon);
      font-family:monospace;
      box-shadow: 0 6px 18px rgba(0,0,0,0.8);
    }

    h1{
      font-size:18px;
      margin:0;
      color:#dfeff0;
      letter-spacing:0.02em;
    }

    .subtitle{
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
    }

    /* control area */
    .controls{
      display:flex;
      gap:12px;
      align-items:center;
    }

    .btn {
      background:linear-gradient(180deg, rgba(57,255,20,0.12), rgba(57,255,20,0.06));
      color:var(--neon);
      padding:10px 16px;
      border-radius:10px;
      border:1px solid rgba(57,255,20,0.18);
      font-weight:700;
      cursor:pointer;
      box-shadow: 0 8px 30px rgba(0,0,0,0.7);
      transition:transform .16s ease, box-shadow .16s ease, opacity .12s;
      white-space:nowrap;
    }

    .btn:active{ transform:translateY(1px) scale(.998); }
    .btn.ghost{
      background:transparent;
      border:1px solid rgba(255,255,255,0.04);
      color:var(--muted);
    }

    .search {
      background:var(--panel);
      border:1px solid rgba(255,255,255,0.03);
      color:#cfe6d0;
      padding:10px 12px;
      border-radius:10px;
      min-width:200px;
      outline:none;
      box-shadow: inset 0 -6px 30px rgba(0,0,0,0.6);
    }

    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.01));
      border:1px solid rgba(57,255,20,0.06);
      padding:18px;
      border-radius:14px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.75);
      overflow:hidden;
    }

    /* Loading area */
    .loading {
      display:flex;
      gap:12px;
      align-items:center;
      color:var(--muted);
    }

    .spinner {
      width:34px;
      height:34px;
      border-radius:50%;
      border:3px solid rgba(57,255,20,0.08);
      border-top-color:var(--neon);
      animation:spin 0.9s linear infinite;
    }
    @keyframes spin{ to{ transform:rotate(360deg); } }

    /* results layout: desktop table, mobile cards */
    .results {
      margin-top:16px;
    }

    table {
      width:100%;
      border-collapse:collapse;
      color:#dfffe2;
      font-size:14px;
    }

    thead th{
      text-align:left;
      padding:12px 14px;
      font-weight:700;
      color:var(--muted);
      font-size:12px;
      letter-spacing:0.06em;
      border-bottom:1px solid rgba(255,255,255,0.03);
      background:linear-gradient(180deg, rgba(0,0,0,0.02), transparent);
    }

    tbody tr {
      transition:transform .18s ease, background .18s ease;
      border-bottom:1px solid rgba(255,255,255,0.02);
    }
    tbody tr:hover { transform:translateX(6px); background:var(--accent); }

    td { padding:12px 14px; vertical-align:middle; font-weight:600; color:#cfe6d0; }

    .action-link{
      display:inline-block;
      padding:8px 12px;
      border-radius:8px;
      font-weight:700;
      background:rgba(57,255,20,0.06);
      color:var(--neon);
      border:1px solid rgba(57,255,20,0.12);
      text-decoration:none;
      transition:transform .12s ease;
    }
    .action-link:hover{ transform:scale(1.03); }

    /* Mobile card view */
    .cards { display:none; gap:12px; flex-direction:column; }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.006));
      border:1px solid rgba(255,255,255,0.03);
      padding:12px;
      border-radius:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .meta { display:flex; gap:8px; flex-direction:column; }
    .meta .user { font-weight:800; color:#bfffb0; }
    .meta .count { font-size:13px; color:var(--muted); }

    /* responsiveness */
    @media (max-width:900px){
      .page{ padding:16px; margin:18px auto; }
      header{ flex-direction:column; align-items:flex-start; gap:12px; }
      .controls{ width:100%; justify-content:space-between; }
      .search{ min-width:120px; flex:1; }
    }
    @media (max-width:720px){
      /* table hidden, show cards */
      table { display:none; }
      .cards { display:flex; }
      .btn{ padding:10px 12px; font-size:14px; }
      .brand { gap:10px; }
      .logo{ width:48px; height:48px; font-size:16px; }
      .panel{ padding:14px; }
    }

    /* subtle animation for headings */
    .glitch{
      color:var(--neon);
      text-shadow: 0 0 6px rgba(57,255,20,0.12);
      font-weight:800;
      letter-spacing:0.04em;
    }

  </style>
</head>
<body>
  <div class="page">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="logo">EM</div>
        <div>
          <h1>EMMY — F4F Finder (Pro)</h1>
          <div class="subtitle">Targeted TikTok discovery — smart networking, minimal noise</div>
        </div>
      </div>

      <div class="controls">
        <input id="q" class="search" placeholder="Filter username (optional)" />
        <button id="runBtn" class="btn">Run Finder</button>
      </div>
    </header>

    <!-- Main panel -->
    <section class="panel">
      <div class="loading" id="loading" style="display:none;">
        <div class="spinner" aria-hidden="true"></div>
        <div>
          <div style="font-weight:700;color:#dfeff0;">Fetching profiles…</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;">Results prioritized by follower-to-following ratio and recent activity</div>
        </div>
      </div>

      <div class="results" id="results" aria-live="polite">
        <!-- Table for desktop -->
        <table aria-hidden="false">
          <thead>
            <tr>
              <th>Username</th>
              <th>Followers</th>
              <th>Following</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>

        <!-- Cards for mobile -->
        <div class="cards" id="cardList" style="display:none;"></div>
      </div>
    </section>
  </div>

<script>
  const runBtn = document.getElementById('runBtn');
  const loadingEl = document.getElementById('loading');
  const tableBody = document.getElementById('tableBody');
  const cardList = document.getElementById('cardList');
  const qInput = document.getElementById('q');
  let latestData = [];

  function fmt(n) {
    if (n === null || n === undefined) return '-';
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function openTikTokProfile(username) {
    // Try TikTok app first
    const appLink = `tiktok://@${username}`;
    const webLink = `https://www.tiktok.com/@${username}`;

    // Attempt to open TikTok app
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = appLink;
    document.body.appendChild(iframe);

    // Fallback to web after 1.2 seconds if app not available
    setTimeout(() => {
      window.open(webLink, '_blank');
      document.body.removeChild(iframe);
    }, 1200);
  }

  function renderResults(data) {
    latestData = data;
    tableBody.innerHTML = '';
    cardList.innerHTML = '';

    const q = qInput.value.trim().toLowerCase();
    const filtered = q ? data.filter(u => u.username.toLowerCase().includes(q)) : data;

    if (filtered.length === 0) {
      tableBody.innerHTML = '<tr><td colspan="4" style="padding:18px;color:var(--muted);font-weight:600;">No profiles found.</td></tr>';
      cardList.innerHTML = `<div class="card" style="justify-content:center;color:var(--muted)">No profiles found.</div>`;
      return;
    }

    filtered.forEach((u) => {
      // Create follow action
      const followAction = `
        <button class="action-link follow-btn" data-username="${u.username}">
          Follow
        </button>
      `;

      // Table view
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="font-weight:800;color:#bfffb0">@${u.username}</td>
        <td>${fmt(u.followers)}</td>
        <td>${fmt(u.following)}</td>
        <td>${followAction}</td>
      `;
      tableBody.appendChild(tr);

      // Mobile card view
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:6px;flex:1;">
          <div class="user" style="font-weight:800;color:#bfffb0">@${u.username}</div>
          <div class="count" style="display:flex;gap:12px;">
            <div style="color:var(--muted)">Followers: ${fmt(u.followers)}</div>
            <div style="color:var(--muted)">Following: ${fmt(u.following)}</div>
          </div>
        </div>
        <div>
          ${followAction}
        </div>
      `;
      cardList.appendChild(card);
    });

    attachFollowEvents();
    toggleResponsiveView();
  }

  function attachFollowEvents() {
    const buttons = document.querySelectorAll('.follow-btn');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const username = btn.dataset.username;
        btn.textContent = 'Following...';
        btn.style.opacity = '0.7';
        btn.disabled = true;

        // Trigger the TikTok app or web profile
        openTikTokProfile(username);

        setTimeout(() => {
          btn.textContent = 'Followed ✅';
          btn.style.background = 'rgba(57,255,20,0.2)';
          btn.style.color = '#39FF14';
          btn.style.borderColor = 'rgba(57,255,20,0.25)';
          btn.disabled = true;
          btn.style.opacity = '1';
        }, 2000);
      });
    });
  }

  async function runFinder() {
    loadingEl.style.display = 'flex';
    tableBody.innerHTML = '';
    cardList.innerHTML = '';

    try {
      const res = await fetch('/run', { method: 'GET' });
      if (!res.ok) throw new Error('Server returned ' + res.status);
      const data = await res.json();

      if (!Array.isArray(data)) throw new Error('Invalid data format');

      renderResults(data);
    } catch (err) {
      tableBody.innerHTML = `<tr><td colspan="4" style="padding:18px;color:#ff9a9a;font-weight:700">Error: ${err.message}</td></tr>`;
      cardList.innerHTML = `<div class="card" style="justify-content:center;color:#ff9a9a">Error: ${err.message}</div>`;
    } finally {
      loadingEl.style.display = 'none';
    }
  }

  function toggleResponsiveView() {
    const mobile = window.matchMedia('(max-width:720px)').matches;
    document.querySelector('table').style.display = mobile ? 'none' : 'table';
    cardList.style.display = mobile ? 'flex' : 'none';
  }

  runBtn.addEventListener('click', runFinder);
  qInput.addEventListener('keyup', (e) => {
    if (e.key === 'Enter') {
      if (latestData.length) renderResults(latestData);
      else runFinder();
    }
  });

  window.addEventListener('resize', toggleResponsiveView);
</script>

</body>
</html>
